<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𓄂𝐕𝐀𝐓𝐀𝐍࿐</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>
      <body>
    <!-- ===== GOLDEN PARTICLES BACKGROUND ===== -->
    <div class="golden-particles" id="particles"></div>

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash">
        <div class="splash-content">
            <div class="splash-logo">❤️</div>
            <h1 class="splash-title">𓄂𝐕𝐀𝐓𝐀𝐍࿐</h1>
            <p class="splash-sub">به نام ایران باستان...</p>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="app" style="display:none;">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="site-title">𓄂𝐕𝐀𝐓𝐀𝐍࿐</span>
            </div>
            <div class="header-right">
                <span id="userDisplay" style="display:none;"></span>
                <button id="menuBtn" class="menu-btn">☰</button>
            </div>
        </header>

<!-- ===== LOBBY ===== -->
<main id="lobby" class="lobby">
    <!-- Announcements Slider -->
    <section class="announcements-section">
        <h2 class="section-title">📜 اطلاعیه‌ها</h2>
        <div class="slider-container">
            <div id="slider" class="slider">
                <!-- اسلایدها اینجا می‌آیند -->
            </div>
            <div class="slider-dots" id="sliderDots"></div>
        </div>
    </section>

    <!-- Members List -->
    <section class="members-section">
        <h2 class="section-title">👥 اعضای اتحاد</h2>
        <div id="membersList" class="members-list-vertical"></div>
    </section>
</main>

        <!-- ===== GLASS MENU ===== -->
        <div id="glassMenu" class="glass-menu" style="display:none;">
            <div class="glass-content">
                <button class="close-menu" id="closeMenu">✕</button>
                <nav class="menu-nav">
                    <button class="menu-item" data-page="home">🏠 خانه</button>
                    <button class="menu-item" data-page="announcements">📜 اطلاعیه‌ها</button>
                    <button class="menu-item" data-page="members">👥 اعضا</button>
                    <button class="menu-item" data-page="battles">🏆 نتایج جنگ‌ها</button>
                    <button class="menu-item" data-page="chat">💬 چت</button>
                    <button class="menu-item" data-page="login" id="loginBtn">🔐 ورود / ثبت‌نام</button>
                    <button class="menu-item" data-page="profile" id="profileBtn" style="display:none;">👤 پنل کاربری</button>
                    <button class="menu-item" data-page="admin" id="adminBtn" style="display:none;">⚙️ پنل مدیریت</button>
                    <button class="menu-item" id="logoutBtn" style="display:none;">🚪 خروج</button>
                </nav>
            </div>
        </div>

        <!-- ===== PAGES ===== -->
        <div id="pageContainer" class="page-container"></div>

        <!-- ===== FOOTER ===== -->
        <footer class="footer">
            <p>© 2026 𓄂𝐕𝐀𝐓𝐀𝐍࿐ | تمامی حقوق محفوظ است</p>
        </footer>
    </div>

    <!-- ===== SCRIPTS ===== -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
